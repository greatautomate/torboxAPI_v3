<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="TorBox Gateway — one TorBox account, unlimited safe API keys. Multi-tenant API gateway with scopes, rate limits, quotas, logs, permalinks, streaming and webhooks." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>TorBox Gateway</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tbg.theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
